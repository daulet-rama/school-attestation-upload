<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Загрузка документов аттестации</title>
    <meta name="description" content="Загрузка документов государственной аттестации по разделам.">
    <meta name="theme-color" content="#087e87">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap&subset=cyrillic-ext" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23087e87'/%3E%3Cpath d='M17 18h23a7 7 0 0 1 7 7v24H24a7 7 0 0 1-7-7V18Z' fill='%23fff'/%3E%3Cpath d='M24 18h23v31H24a7 7 0 0 0-7 7V25a7 7 0 0 1 7-7Z' fill='%23ff9b20'/%3E%3Cpath d='M30 27h10M30 34h10' stroke='%23087e87' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="assets/style.css?v=1">
</head>
<body class="mode-upload">
<aside class="sidebar" id="sidebar" aria-label="Информация об организации">
    <div class="brand">
        <div class="brand-logo" id="brandLogo"></div>
        <h1 id="siteName"></h1>
        <p id="slogan"></p>
    </div>

    <div class="director">
        <div class="director-photo" id="directorPhoto"></div>
        <div>
            <small id="directorRole"></small>
            <strong id="directorName"></strong>
        </div>
    </div>

    <div class="facts">
        <div class="fact">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M2 21v-2a6 6 0 0 1 12 0v2M14 16a5 5 0 0 1 8 4v1"/></svg>
            <div><span id="studentsLabel"></span><b id="studentsValue"></b></div>
        </div>
        <div class="fact">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 7 9-4 9 4-9 4-9-4Z"/><path d="M7 10v5c3 2 7 2 10 0v-5M21 7v6"/></svg>
            <div><span id="teachersLabel"></span><b id="teachersValue"></b></div>
        </div>
        <div class="fact">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16M7 3v4M17 3v4M5 10h14v10H5z"/><path d="M9 14h2M13 14h2"/></svg>
            <div><span id="languagesLabel"></span><b id="languagesValue"></b></div>
        </div>
        <div class="fact">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <div><span id="hoursLabel"></span><b id="hoursValue"></b></div>
        </div>
    </div>

    <div class="contacts">
        <a class="contact" id="mapLink" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>
            <span id="addressValue"></span>
        </a>
        <a class="contact" id="phoneLink">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.6a2 2 0 0 1-.4 2.1L8.1 9.7a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.8.3 1.7.6 2.6.7a2 2 0 0 1 1.9 2.2Z"/></svg>
            <span id="phoneValue"></span>
        </a>
        <a class="contact" id="emailLink">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <span id="emailValue"></span>
        </a>
    </div>
</aside>

<main>
    <header class="topbar">
        <div>
            <h2 id="mainTitle"></h2>
            <p id="mainLead"></p>
        </div>
        <div class="header-actions">
            <button class="header-home" id="headerHome" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>
                <span id="headerHomeLabel"></span>
            </button>
            <div class="language-switch" id="languageSwitch" role="group">
                <button type="button" data-lang="kk">ҚАЗ</button>
                <button type="button" data-lang="ru">РУС</button>
            </div>
            <div class="badge" id="statusBadge"><i></i><span id="statusBadgeText"></span></div>
        </div>
    </header>

    <section class="search-panel" id="searchPanel">
        <label class="searchbox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <input id="search" type="search" autocomplete="off">
        </label>
        <select id="categorySelect" class="category-select"></select>
    </section>

    <div class="notices" id="notices"></div>

    <section class="stats" id="stats"></section>

    <p class="sr-only" id="liveStatus" aria-live="polite"></p>

    <section id="workspace" class="workspace"></section>

    <footer class="mobile-footer" id="mobileFooter"></footer>
</main>

<aside class="rail" id="rail">
    <div class="rail-copy" id="railCopy"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="assets/config.js?v=1"></script>
<script src="assets/structure.js?v=1"></script>
<script src="assets/app.js?v=1"></script>
</body>
</html>
